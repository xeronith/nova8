<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Tile surfaces -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1A2A3A"/>
      <stop offset="0.52" stop-color="#0D1520"/>
      <stop offset="1" stop-color="#060A0F"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.2" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#7FE4F2" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#5BD8E8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#5BD8E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5BD8E8" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#5BD8E8" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#5BD8E8" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#5BD8E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#C9FBFF" stop-opacity="0.5"/>
      <stop offset="0.35" stop-color="#8DEBF5" stop-opacity="0.16"/>
      <stop offset="0.72" stop-color="#8DEBF5" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="markFill" gradientUnits="userSpaceOnUse" x1="330" y1="276" x2="690" y2="748">
      <stop offset="0" stop-color="#F4FEFF"/>
      <stop offset="0.5" stop-color="#C4F7FD"/>
      <stop offset="1" stop-color="#63DEED"/>
    </linearGradient>
    <linearGradient id="markEdge" gradientUnits="userSpaceOnUse" x1="330" y1="276" x2="690" y2="748">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#DFFBFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5BD8E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060A0F" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#060A0F" stop-opacity="0"/>
      <stop offset="1" stop-color="#060A0F" stop-opacity="0.5"/>
    </linearGradient>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#grid)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>

    <!-- Circuit traces -->
    <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 250V190H250" stroke="#F4B860" stroke-opacity="0.55"/>
      <path d="M874 250V190H774" stroke="#B69CFF" stroke-opacity="0.55"/>
      <path d="M150 774V834H250" stroke="#5BD8E8" stroke-opacity="0.5"/>
      <path d="M874 774V834H774" stroke="#72E3A6" stroke-opacity="0.5"/>
    </g>
    <g>
      <circle cx="250" cy="190" r="9" fill="#F4B860" fill-opacity="0.75"/>
      <circle cx="250" cy="190" r="3.5" fill="#0B1119" fill-opacity="0.55"/>
      <circle cx="774" cy="190" r="9" fill="#B69CFF" fill-opacity="0.75"/>
      <circle cx="774" cy="190" r="3.5" fill="#0B1119" fill-opacity="0.55"/>
      <circle cx="250" cy="834" r="9" fill="#5BD8E8" fill-opacity="0.7"/>
      <circle cx="250" cy="834" r="3.5" fill="#0B1119" fill-opacity="0.55"/>
      <circle cx="774" cy="834" r="9" fill="#72E3A6" fill-opacity="0.7"/>
      <circle cx="774" cy="834" r="3.5" fill="#0B1119" fill-opacity="0.55"/>
    </g>

    <!-- Halo -->
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- N8 monogram: ink bounds x 238-786, y 276-748, optically centred on 512,512 -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="url(#markFill)" stroke-width="80">
        <path d="M278 326V702M278 326L458 702M458 326V702"/>
        <ellipse cx="662" cy="408" rx="74" ry="92"/>
        <ellipse cx="662" cy="608" rx="84" ry="100"/>
      </g>
      <g stroke="url(#markEdge)" stroke-width="18" stroke-opacity="0.5">
        <path d="M278 326V702M278 326L458 702M458 326V702"/>
        <ellipse cx="662" cy="408" rx="74" ry="92"/>
        <ellipse cx="662" cy="608" rx="84" ry="100"/>
      </g>
    </g>

    <rect x="100" y="100" width="824" height="824" fill="url(#shade)"/>
  </g>

  <!-- Rim -->
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
